[package]
name = "ats2-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Safe USB transport and conservative APIB framing for Audio Precision ATS-2 adapters"
license = "Apache-2.0"

[lib]
name = "ats2_rs"
path = "src/lib.rs"

[[bin]]
name = "ats2"
path = "src/main.rs"

[[bin]]
name = "ats2-gui"
path = "src/bin/ats2-gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_plot"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui = { version = "=0.31.1", optional = true }
egui_plot = { version = "=0.31.0", optional = true }
rusb = "0.9.4"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
